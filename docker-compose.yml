services:
  postgres:
    image: postgres:15-alpine
    container_name: gold-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gold}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gold_secret_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-gold_trading}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gold -d gold_trading"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gold-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gold-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gold}:${POSTGRES_PASSWORD:-gold_secret_change_me}@postgres:5432/${POSTGRES_DB:-gold_trading}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY is required}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      NODE_ENV: production
      EXPOSE_DEV_OTP: "false"
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      GOLD_PRICE_SOURCE: ${GOLD_PRICE_SOURCE:-http}
      GOLD_PRICE_URL: ${GOLD_PRICE_URL:-}
      GOLD_ALLOW_SIMULATED: ${GOLD_ALLOW_SIMULATED:-false}
      PAYMENT_MODE: ${PAYMENT_MODE:-gateway}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      KYC_MODE: ${KYC_MODE:-live}
      PORT: 3001
    ports:
      - "3001:3001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gold-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: 3000
      API_PROXY_TARGET: http://backend:3001
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
